<section class="catalog">
  <header class="catalog__head">
    <h1>Input</h1>
    <p>Label, prefix, readonly, validation via tronErrors.</p>
  </header>

  <div class="catalog__block">
    <h2>Field</h2>
    <div class="catalog__stack">
      <tron-toggle label="Readonly" [(value)]="readonly$" />
      <tron-input
        label="User Identifier"
        placeholder="Enter value"
        [formControl]="id"
        [readonly]="readonly$()"
        tronErrors
      >
        <tron-icon tronPrefix name="user" />
      </tron-input>
      <tron-input label="Access code" type="password" placeholder="••••••••" />
    </div>
  </div>

  <div class="catalog__block">
    <h2>Custom validator</h2>
    <tron-input
      label="Disc signature"
      placeholder="TRON-0000"
      hint="Validator carries its own message"
      [formControl]="disc"
      tronErrors
    />
  </div>
</section>
