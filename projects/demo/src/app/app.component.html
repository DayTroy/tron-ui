<div class="shell">
  <aside class="shell__nav">
    <a class="shell__brand" routerLink="/" aria-label="Tron UI">
      <ng-container [ngTemplateOutlet]="markTpl" />
      <span>TRON UI</span>
    </a>
    <ng-container [ngTemplateOutlet]="navTpl" />
  </aside>

  <header class="shell__topbar">
    <button
      class="shell__burger"
      type="button"
      aria-label="Open catalog"
      (click)="openNav()"
    >
      <tron-icon name="menu" />
    </button>

    <a class="shell__brand" routerLink="/" aria-label="Tron UI">
      <ng-container [ngTemplateOutlet]="markTpl" />
      <span>TRON UI</span>
    </a>
  </header>

  <main class="shell__main">
    <router-outlet />
  </main>
</div>

<ng-template #markTpl>
  <svg class="shell__mark" viewBox="0 0 32 32" aria-hidden="true">
    <circle class="shell__mark-disc" cx="16" cy="16" r="15" />
    <circle class="shell__mark-ring" cx="16" cy="16" r="13.75" />
    <rect class="shell__mark-bit" x="6.8" y="10.8" width="5.2" height="5.2" rx="0.7" />
    <rect class="shell__mark-bit" x="13.4" y="10.8" width="5.2" height="5.2" rx="0.7" />
    <rect class="shell__mark-bit" x="20" y="10.8" width="5.2" height="5.2" rx="0.7" />
    <rect class="shell__mark-bit" x="13.4" y="17.4" width="5.2" height="5.2" rx="0.7" />
  </svg>
</ng-template>

<ng-template #navTpl>
  <div class="shell__groups">
    @for (group of nav; track group.label) {
      <div class="shell__group">
        <span class="shell__group-label">{{ group.label }}</span>
        @for (item of group.items; track item.path) {
          <a
            class="shell__link"
            [routerLink]="item.path"
            routerLinkActive="is-active"
            (click)="closeNav()"
          >{{ item.label }}</a>
        }
      </div>
    }
  </div>
</ng-template>
