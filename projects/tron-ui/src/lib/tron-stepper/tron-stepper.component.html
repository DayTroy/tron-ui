<div class="tron-stepper">
  @for (item of $data(); track item.name; let i = $index; let isLast = $last) {
    <div
      class="tron-stepper__item"
      [class.tron-stepper__item--active]="$currentStep() === i"
      [class.tron-stepper__item--completed]="$currentStep() > i"
    >
      <button
        class="tron-stepper__btn"
        type="button"
        [attr.aria-current]="$currentStep() === i ? 'step' : null"
        [attr.aria-label]="item.name"
        (click)="setStep(i)"
      >
        @if ($currentStep() > i) {
          <tron-icon class="tron-stepper__check" name="check" />
        } @else {
          {{ i + 1 }}
        }
      </button>

      <div class="tron-stepper__copy">
        <div class="tron-stepper__title">{{ item.name }}</div>
        @if (item.description) {
          <div class="tron-stepper__desc">{{ item.description }}</div>
        }
      </div>

      @if (!isLast) {
        <div
          class="tron-stepper__connector"
          [class.tron-stepper__connector--active]="$currentStep() > i"
        ></div>
      }
    </div>
  }
</div>
