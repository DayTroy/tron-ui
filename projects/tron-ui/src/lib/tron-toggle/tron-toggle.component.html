<label class="tron-toggle" [class.tron-toggle--disabled]="$isDisabled()">
  <button
    class="tron-toggle__track"
    type="button"
    role="switch"
    [attr.aria-checked]="$value()"
    [attr.aria-label]="$label()"
    [disabled]="$isDisabled()"
    (click)="toggle()"
  >
    <div class="tron-toggle__thumb" [class.tron-toggle__thumb--on]="$value()"></div>
  </button>

  @if ($label()) {
    <span class="tron-toggle__label">{{ $label() }}</span>
  }
</label>
