<label class="tron-toggle" [class.tron-toggle--disabled]="$isDisabled()">
  <button
    class="tron-toggle__track"
    [class.tron-toggle__track--checked]="$value()"
    type="button"
    role="switch"
    [attr.aria-checked]="$value()"
    [attr.aria-label]="$label()"
    [disabled]="$isDisabled()"
    (click)="toggle()"
  >
    <div class="tron-toggle__thumb" [class.tron-toggle__thumb--on]="$value()">
      <span class="tron-toggle__thumb-icon" [class.tron-toggle__thumb-icon--hidden]="$value()">
        <ng-content select="[tronThumbOff]" />
      </span>
      <span class="tron-toggle__thumb-icon" [class.tron-toggle__thumb-icon--hidden]="!$value()">
        <ng-content select="[tronThumbOn]" />
      </span>
    </div>
  </button>

  @if ($label()) {
    <span class="tron-toggle__label">{{ $label() }}</span>
  }
</label>
