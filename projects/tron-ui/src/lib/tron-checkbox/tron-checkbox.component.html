<label
  class="tron-checkbox"
  [class.tron-checkbox--disabled]="$isDisabled()"
  [class.tron-checkbox--checked]="$checked()"
>
  <input
    class="tron-checkbox__native"
    type="checkbox"
    [checked]="$checked()"
    [disabled]="$isDisabled()"
    (change)="onNativeChange($event)"
    (blur)="onBlur()"
  />

  <span class="tron-checkbox__box" aria-hidden="true">
    <tron-icon class="tron-checkbox__check" name="check" />
  </span>

  <span class="tron-checkbox__label"><ng-content /></span>
</label>
