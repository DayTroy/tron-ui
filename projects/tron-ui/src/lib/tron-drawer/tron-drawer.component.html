<div
  class="tron-drawer"
  [class.tron-drawer--start]="$position() === 'start'"
  [class.tron-drawer--end]="$position() === 'end'"
  [class.tron-drawer--leave]="$leaving()"
  cdkTrapFocus
  cdkTrapFocusAutoCapture
  role="dialog"
  aria-modal="true"
  [attr.aria-labelledby]="titleId"
>
  <div class="tron-drawer__head">
    <div class="tron-drawer__heading">
      <span class="tron-drawer__title" [id]="titleId">{{ $title() }}</span>
      @if ($subtitle()) {
        <span class="tron-drawer__subtitle">{{ $subtitle() }}</span>
      }
    </div>
    <button
      class="tron-drawer__close"
      type="button"
      aria-label="Close"
      (click)="close()"
    >×</button>
  </div>

  <div class="tron-drawer__body">
    @if ($template(); as tpl) {
      <ng-container [ngTemplateOutlet]="tpl" />
    } @else {
      <ng-container [ngComponentOutlet]="$component()" />
    }
  </div>
</div>
