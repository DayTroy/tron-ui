<div
  class="tron-progress"
  [class.tron-progress--success]="$type() === 'success'"
  [class.tron-progress--warning]="$type() === 'warning'"
  [class.tron-progress--danger]="$type() === 'danger'"
>
  <div
    class="tron-progress__track"
    role="progressbar"
    [attr.aria-valuenow]="$value()"
    [attr.aria-valuemin]="0"
    [attr.aria-valuemax]="$max()"
  >
    <div class="tron-progress__fill" [style.width.%]="$percent()"></div>
  </div>
</div>
