<div
  class="tron-toast"
  [class.tron-toast--info]="$type() === 'info'"
  [class.tron-toast--success]="$type() === 'success'"
  [class.tron-toast--warning]="$type() === 'warning'"
  [class.tron-toast--danger]="$type() === 'danger'"
>
  <div class="tron-toast__head">
    <span class="tron-toast__icon" aria-hidden="true">
      @switch ($type()) {
        @case ('success') {
          <svg viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.2"/>
            <path d="M5 8.2l2.1 2.1L11.2 6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        }
        @case ('warning') {
          <svg viewBox="0 0 16 16" fill="none">
            <path d="M8 2.5L14.5 13.5H1.5L8 2.5z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M8 6.75v3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            <circle cx="8" cy="11.5" r="0.7" fill="currentColor"/>
          </svg>
        }
        @case ('danger') {
          <svg viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.2"/>
            <path d="M6 6l4 4M10 6l-4 4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
        }
        @default {
          <svg viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.2"/>
            <path d="M8 7.25v4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            <circle cx="8" cy="5.25" r="0.7" fill="currentColor"/>
          </svg>
        }
      }
    </span>
    <span class="tron-toast__label">{{ $label() }}</span>
    <button class="tron-toast__close" type="button" aria-label="Dismiss" (click)="dismiss()">×</button>
  </div>
  <div class="tron-toast__title">{{ $title() }}</div>
  @if ($message()) {
    <div class="tron-toast__message">{{ $message() }}</div>
  }
</div>
