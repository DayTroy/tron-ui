<div class="tron-input">
  @if ($label()) {
    <label class="tron-input__label" [for]="fieldId">{{ $label() }}</label>
  }
  
  <div class="tron-input__control">
    <span class="tron-input__prefix"><ng-content select="[tronPrefix]" /></span>

    <input
      class="tron-input__field"
      [id]="fieldId"
      [value]="$value()"
      [placeholder]="$placeholder()"
      (input)="$value.set($any($event.target).value)"
    />

    <span class="tron-input__suffix"><ng-content select="[tronSuffix]" /></span>
  </div> 

  @if ($hint()) {
    <div class="tron-input__hint">{{ $hint() }}</div>
  }

  <!-- тут надо подумать как сделать не boilerplate код чтобы мб как-то ошибки подсвечивались -->
  
</div>
