<div class="tron-input"
  data-tron-field
  [class.tron-input--disabled]="$isDisabled()"
  [class.tron-input--readonly]="$readonly()"
  [class.tron-input--error]="$isInvalid()">
  @if ($label()) {
    <label class="tron-input__label" [for]="fieldId">{{ $label() }}</label>
  }
  
  <div class="tron-input__control">
    <span class="tron-input__prefix"><ng-content select="[tronPrefix]" /></span>

    <input
      class="tron-input__field"
      [id]="fieldId"
      [type]="$type()"
      [readonly]="$readonly()"
      [disabled]="$isDisabled()"
      [value]="$value()"
      [placeholder]="$placeholder()"
      [attr.aria-invalid]="$isInvalid()"
      (input)="onInputChange($any($event.target).value)"
      (blur)="onBlur()"
    />

    <span class="tron-input__suffix"><ng-content select="[tronSuffix]" /></span>
  </div> 

  @if ($hint()) {
    <div class="tron-input__hint">{{ $hint() }}</div>
  }
</div>
