<div
  class="tron-select"
  data-tron-field
  [class.tron-select--disabled]="$isDisabled()"
  [class.tron-select--error]="$isInvalid()"
  [class.tron-select--open]="$isOpen()"
  (focusout)="onFocusOut($event)"
>
  @if ($label()) {
    <label class="tron-select__label" [for]="fieldId">{{ $label() }}</label>
  }

  <div class="tron-select__field">
    <button
      class="tron-select__control"
      type="button"
      role="combobox"
      [id]="fieldId"
      [disabled]="$isDisabled()"
      [attr.aria-invalid]="$isInvalid()"
      [attr.aria-expanded]="$isOpen()"
      [attr.aria-haspopup]="'listbox'"
      [attr.aria-controls]="listboxId"
      [attr.aria-activedescendant]="$activeDescendant()"
      (click)="toggle()"
      (keydown)="onKeydown($event)"
    >
      <span class="tron-select__prefix"><ng-content select="[tronPrefix]" /></span>

      <span
        class="tron-select__value"
        [class.tron-select__value--placeholder]="!$display()"
      >{{ $display() || $placeholder() }}</span>

      <span class="tron-select__chevron" aria-hidden="true">
        <tron-icon name="chevron-down" size="sm" />
      </span>
    </button>

    @if ($isOpen()) {
      <ul class="tron-select__panel" role="listbox" [id]="listboxId">
        @for (option of $options(); track option.value; let i = $index) {
          <li
            class="tron-select__option"
            role="option"
            [id]="optionId(i)"
            [class.tron-select__option--selected]="option.value === $value()"
            [class.tron-select__option--highlighted]="i === $highlightedIndex()"
            [class.tron-select__option--disabled]="option.disabled"
            [attr.aria-selected]="option.value === $value()"
            [attr.aria-disabled]="option.disabled || null"
            (mousedown)="select(option, $event)"
            (mouseenter)="highlight(i)"
          >{{ option.label }}</li>
        }
      </ul>
    }
  </div>

  @if ($hint()) {
    <div class="tron-select__hint">{{ $hint() }}</div>
  }
</div>
